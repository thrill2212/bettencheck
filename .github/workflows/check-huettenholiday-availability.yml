name: Check Hüttenholiday Availability

on:
  # Run every 3 hours
  schedule:
    - cron: '0 */3 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  check-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Hüttenholiday cabin list from live published routes
        run: |
          set -euo pipefail
          node scripts/build-live-target-lists.mjs \
            --hut-output /tmp/huts.from-live-targets.json \
            --huettenholiday-output scrapers/huettenholiday/cabins.from-live-targets.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check Hüttenholiday availability
        id: scrape_huettenholiday
        run: bash scrapers/huettenholiday/check-availability.sh
        working-directory: ${{ github.workspace }}
        env:
          CABIN_LIST_FILE: ./cabins.from-live-targets.json

      - name: Normalize and upsert to Supabase
        if: always()
        run: |
          node scripts/normalize-and-upsert.mjs \
            --source huettenholiday \
            --input-dir scrapers/huettenholiday/availability-results \
            --run-id "${{ github.run_id }}" \
            --scraper-outcome "${{ steps.scrape_huettenholiday.outcome }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload availability results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huettenholiday-availability-results-${{ github.run_number }}
          path: scrapers/huettenholiday/availability-results/*.json
          retention-days: 90

      - name: Display summary
        if: always()
        run: |
          echo "✅ Hüttenholiday availability check completed"
          echo "📁 Results have been saved as artifacts"

          if [ -f scrapers/huettenholiday/availability-results/*.json ]; then
            echo ""
            echo "Generated files:"
            ls -lh scrapers/huettenholiday/availability-results/
          fi
