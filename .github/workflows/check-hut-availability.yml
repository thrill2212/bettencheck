name: Check Hut Availability

on:
  # Run every 3 hours
  schedule:
    - cron: '0 */3 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: rotating
        type: choice
        options:
          - rotating
          - full

concurrency:
  group: hut-availability-global
  cancel-in-progress: false

jobs:
  check-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore hut info cache
        uses: actions/cache@v4
        with:
          path: scrapers/hut-reservation/.cache/hut-info
          key: hut-info-cache-v1

      - name: Build hut list from live published routes
        run: |
          set -euo pipefail
          node scripts/build-live-target-lists.mjs \
            --hut-output scrapers/hut-reservation/huts.from-coverage.json \
            --huettenholiday-output /tmp/cabins.from-live-targets.json
          echo "Generated hut list:"
          jq 'length' scrapers/hut-reservation/huts.from-coverage.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Select run profile and hut subset
        id: select_profile
        run: |
          set -euo pipefail
          requested_mode="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'rotating' }}"
          mode="$requested_mode"
          shard_reason=""

          # Self-heal after upstream incidents: if route-scoped data is stale or incomplete,
          # promote the next rotating run to a full route refresh.
          if [ "$requested_mode" = "rotating" ]; then
            readiness_json="$(mktemp)"
            readiness_stderr="$(mktemp)"
            if node scripts/check-live-readiness-gate.mjs >"$readiness_json" 2>"$readiness_stderr"; then
              :
            elif jq -e '(.notCoverageReadyRoutes | length > 0) or (.notFreshRoutes | length > 0)' "$readiness_json" >/dev/null 2>&1; then
              mode="full"
              shard_reason="recovery-full"
              echo "Preflight readiness is stale/incomplete. Promoting rotating run to full refresh."
              jq '{notCoverageReadyRoutes, notFreshRoutes}' "$readiness_json"
            else
              echo "Readiness preflight failed unexpectedly." >&2
              cat "$readiness_stderr" >&2
              exit 1
            fi
          fi

          if [ "$mode" = "full" ]; then
            cp scrapers/hut-reservation/huts.from-coverage.json scrapers/hut-reservation/huts.selected.json
            echo "mode=full" >> "$GITHUB_OUTPUT"
            if [ -n "$shard_reason" ]; then
              echo "shard=$shard_reason" >> "$GITHUB_OUTPUT"
            else
              echo "shard=all" >> "$GITHUB_OUTPUT"
            fi
            echo "fetch_hut_info=true" >> "$GITHUB_OUTPUT"
            echo "fetch_hut_info_mode=always" >> "$GITHUB_OUTPUT"
            echo "request_delay=0.20" >> "$GITHUB_OUTPUT"
            echo "max_retries=4" >> "$GITHUB_OUTPUT"
            echo "retry_delay=4" >> "$GITHUB_OUTPUT"
            echo "block_cooldown=20" >> "$GITHUB_OUTPUT"
          else
            hour_utc=$(date -u +%H)
            slot=$(( (10#$hour_utc / 3) % 2 ))
            jq --argjson slot "$slot" 'map(select(((.hutId|tonumber) % 2) == $slot))' \
              scrapers/hut-reservation/huts.from-coverage.json \
              > scrapers/hut-reservation/huts.selected.json
            selected_count=$(jq 'length' scrapers/hut-reservation/huts.selected.json)
            if [ "$selected_count" -eq 0 ]; then
              cp scrapers/hut-reservation/huts.from-coverage.json scrapers/hut-reservation/huts.selected.json
              slot="fallback-full"
            fi
            echo "mode=rotating" >> "$GITHUB_OUTPUT"
            echo "shard=$slot" >> "$GITHUB_OUTPUT"
            echo "fetch_hut_info=false" >> "$GITHUB_OUTPUT"
            echo "fetch_hut_info_mode=missing-cache" >> "$GITHUB_OUTPUT"
            echo "request_delay=0.10" >> "$GITHUB_OUTPUT"
            echo "max_retries=2" >> "$GITHUB_OUTPUT"
            echo "retry_delay=2" >> "$GITHUB_OUTPUT"
            echo "block_cooldown=8" >> "$GITHUB_OUTPUT"
          fi
          echo "Selected huts:"
          jq 'length' scrapers/hut-reservation/huts.selected.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check hut availability (first pass)
        id: scrape_hut_reservation_first
        run: bash scrapers/hut-reservation/check-availability.sh
        working-directory: ${{ github.workspace }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOUR_COVERAGE_FILE: ./tour-id-coverage.json
          HUT_LIST_FILE: ./huts.selected.json
          FETCH_HUT_INFO: ${{ steps.select_profile.outputs.fetch_hut_info }}
          FETCH_HUT_INFO_MODE: ${{ steps.select_profile.outputs.fetch_hut_info_mode }}
          REQUEST_DELAY_SECONDS: ${{ steps.select_profile.outputs.request_delay }}
          MAX_RETRIES: ${{ steps.select_profile.outputs.max_retries }}
          RETRY_DELAY_SECONDS: ${{ steps.select_profile.outputs.retry_delay }}
          BLOCK_COOLDOWN_SECONDS: ${{ steps.select_profile.outputs.block_cooldown }}
          FAILED_HUTS_FILE: ./availability-results/failed-huts.first-pass.json
          SCRAPE_SUMMARY_FILE: ./availability-results/scrape-summary.first-pass.json
          FAIL_ON_HUT_ERRORS: "false"
          BETTENCHECK_RUN_ID: "${{ github.run_id }}-first"

      - name: Repair failed huts (second pass)
        id: scrape_hut_reservation_repair
        if: always()
        run: |
          set -euo pipefail
          SUMMARY_FILE="scrapers/hut-reservation/availability-results/scrape-summary.first-pass.json"
          REPAIR_SUMMARY_FILE="scrapers/hut-reservation/availability-results/scrape-summary.repair-pass.json"

          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "repair_attempted=false" >> "$GITHUB_OUTPUT"
            echo "remaining_failed=-1" >> "$GITHUB_OUTPUT"
            echo "First-pass summary missing."
            exit 0
          fi

          first_failed=$(jq '.failedCount // 0' "$SUMMARY_FILE")
          echo "first_failed=$first_failed" >> "$GITHUB_OUTPUT"
          if [ "$first_failed" -eq 0 ]; then
            echo "repair_attempted=false" >> "$GITHUB_OUTPUT"
            echo "remaining_failed=0" >> "$GITHUB_OUTPUT"
            echo "No failed huts in first pass."
            exit 0
          fi

          echo "repair_attempted=true" >> "$GITHUB_OUTPUT"
          echo "Running repair pass for ${first_failed} huts..."
          bash scrapers/hut-reservation/check-availability.sh

          if [ ! -f "$REPAIR_SUMMARY_FILE" ]; then
            echo "remaining_failed=$first_failed" >> "$GITHUB_OUTPUT"
            echo "Repair summary missing."
            exit 0
          fi

          repair_failed=$(jq '.failedCount // 0' "$REPAIR_SUMMARY_FILE")
          echo "remaining_failed=$repair_failed" >> "$GITHUB_OUTPUT"
          echo "Repair pass remaining failed huts: $repair_failed"
        working-directory: ${{ github.workspace }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOUR_COVERAGE_FILE: ./tour-id-coverage.json
          HUT_LIST_FILE: ./availability-results/failed-huts.first-pass.json
          FETCH_HUT_INFO: "false"
          FETCH_HUT_INFO_MODE: "missing-cache"
          REQUEST_DELAY_SECONDS: "0.20"
          MAX_RETRIES: "4"
          RETRY_DELAY_SECONDS: "4"
          BLOCK_COOLDOWN_SECONDS: "20"
          FAILED_HUTS_FILE: ./availability-results/failed-huts.repair-pass.json
          SCRAPE_SUMMARY_FILE: ./availability-results/scrape-summary.repair-pass.json
          FAIL_ON_HUT_ERRORS: "false"
          BETTENCHECK_RUN_ID: "${{ github.run_id }}-repair"

      - name: Enforce hut scrape quality gate
        if: always()
        run: |
          set -euo pipefail
          FIRST_SUMMARY="scrapers/hut-reservation/availability-results/scrape-summary.first-pass.json"
          REPAIR_SUMMARY="scrapers/hut-reservation/availability-results/scrape-summary.repair-pass.json"

          if [ ! -f "$FIRST_SUMMARY" ]; then
            echo "First-pass summary missing."
            exit 1
          fi

          first_failed=$(jq '.failedCount // 0' "$FIRST_SUMMARY")
          remaining_failed="$first_failed"
          if [ "$first_failed" -gt 0 ] && [ -f "$REPAIR_SUMMARY" ]; then
            remaining_failed=$(jq '.failedCount // 0' "$REPAIR_SUMMARY")
          fi

          echo "first_failed=$first_failed"
          echo "remaining_failed=$remaining_failed"

          if [ "$remaining_failed" -gt 0 ]; then
            echo "Quality gate failed: failed huts remain after repair pass."
            exit 1
          fi

      - name: Enforce hut-reservation freshness gate
        if: always()
        run: node scripts/check-live-readiness-gate.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIVE_READINESS_MAX_STALENESS_HOURS: "8"
          READINESS_PROVIDER_SCOPE: "hut-reservation"

      - name: Upload availability results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hut-availability-results-${{ github.run_number }}-${{ steps.select_profile.outputs.mode }}-${{ steps.select_profile.outputs.shard }}
          path: scrapers/hut-reservation/availability-results/*.json
          retention-days: 90

      - name: Display summary
        if: always()
        run: |
          echo "✅ Hut availability check completed"
          echo "Mode: ${{ steps.select_profile.outputs.mode }}"
          echo "Shard: ${{ steps.select_profile.outputs.shard }}"
          echo "📁 Results have been saved as artifacts"

          if compgen -G "scrapers/hut-reservation/availability-results/*.json" > /dev/null; then
            echo ""
            echo "Generated files:"
            ls -lh scrapers/hut-reservation/availability-results/
          fi
