name: Check Hut Availability

on:
  # Run every 3 hours
  schedule:
    - cron: '0 */3 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  check-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore hut info cache
        uses: actions/cache@v4
        with:
          path: scrapers/hut-reservation/.cache/hut-info
          key: hut-info-cache-v1

      - name: Build hut list from route coverage
        run: |
          node scrapers/hut-reservation/generate-huts-from-tour-coverage.mjs \
            --input scrapers/hut-reservation/tour-id-coverage.json \
            --output scrapers/hut-reservation/huts.from-coverage.json
          echo "Generated hut list:"
          wc -l scrapers/hut-reservation/huts.from-coverage.json || true

      - name: Check hut availability
        id: scrape_hut_reservation
        run: bash scrapers/hut-reservation/check-availability.sh
        working-directory: ${{ github.workspace }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOUR_COVERAGE_FILE: ./tour-id-coverage.json
          HUT_LIST_FILE: ./huts.from-coverage.json
          FETCH_HUT_INFO: "false"
          REQUEST_DELAY_SECONDS: "0.12"
          MAX_RETRIES: "2"
          RETRY_DELAY_SECONDS: "2"
          BLOCK_COOLDOWN_SECONDS: "10"

      - name: Upload availability results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hut-availability-results-${{ github.run_number }}
          path: scrapers/hut-reservation/availability-results/*.json
          retention-days: 90

      - name: Display summary
        if: always()
        run: |
          echo "✅ Hut availability check completed"
          echo "📁 Results have been saved as artifacts"

          if compgen -G "scrapers/hut-reservation/availability-results/*.json" > /dev/null; then
            echo ""
            echo "Generated files:"
            ls -lh scrapers/hut-reservation/availability-results/
          fi
